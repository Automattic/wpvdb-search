name: Checks

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: rbcorrales/wpvdb-scripts/.github/workflows/plugin-ci.yml@main
    with:
      timeout-minutes: 10
      composer-install: true
      php-lint-command: composer lint
      php-analyze-command: composer analyze
