name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, for example v0.5.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  run:
    uses: rbcorrales/wpvdb-scripts/.github/workflows/plugin-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      plugin-slug: wpvdb-search
      plugin-file: wpvdb-search.php
      timeout-minutes: 15
      composer-install: true
      php-lint-command: composer lint
      php-analyze-command: composer analyze
      i18n-command: composer i18n
